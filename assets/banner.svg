<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="subGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="10"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="subtleGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes nodePulse{0%{r:6;opacity:.8}50%{r:9;opacity:1}}@keyframes floatSlow{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}.grid-line{stroke:#1e293b;stroke-width:1;stroke-dasharray:4 4;opacity:.6}.flow-path{stroke-dasharray:8 8;animation:flowDash 20s linear infinite}.pulse-node{animation:nodePulse 3s ease-in-out infinite}.pulse-node-2{animation:nodePulse 3.5s ease-in-out infinite 1s}.pulse-node-3{animation:nodePulse 4s ease-in-out infinite 2s}.pill-badge{transition:all .3s ease}.pill-badge:hover{transform:translateY(-2px)}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><g class="grid-line"><line x1="100" x2="100" y1="0" y2="360"/><line x1="250" x2="250" y1="0" y2="360"/><line x1="400" x2="400" y1="0" y2="360"/><line x1="550" x2="550" y1="0" y2="360"/><line x1="700" x2="700" y1="0" y2="360"/><line x1="850" x2="850" y1="0" y2="360"/><line x1="1000" x2="1000" y1="0" y2="360"