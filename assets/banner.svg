<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradient for Text -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pulsing Node Animation Style -->
    <style>
      .grid-line { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.6; }
      .flow-path { stroke-dasharray: 8 8; animation: flowDash 20s linear infinite; }
      .pulse-node { animation: nodePulse 3s ease-in-out infinite; }
      .pulse-node-2 { animation: nodePulse 3.5s ease-in-out infinite 1s; }
      .pulse-node-3 { animation: nodePulse 4s ease-in-out infinite 2s; }
      .pill-badge { transition: all 0.3s ease; }
      .pill-badge:hover { transform: translateY(-2px); }

      @keyframes flowDash {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes nodePulse {
        0%, 100% { r: 6; opacity: 0.8; }
        50% { r: 9; opacity: 1; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Geometric Grid Pattern (Subtle Background) -->
  <g class="grid-line">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="250" y1="0" x2="250" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="850" y1="0" x2="850" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="1150" y1="0" x2="1150" y2="360" />

    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Animated Dynamic Flow Lines in Background -->
  <g opacity="0.45">
    <path class="flow-path" d="M 50 180 C 200 80, 350 280, 550 180 C 750 80, 950 280, 1150 180" fill="none" stroke="#6366f1" stroke-width="2.5" />
    <path class="flow-path" d="M 80 80 C 280 240, 500 40, 750 200 C 950 320, 1050 120, 1180 100" fill="none" stroke="#0ea5e9" stroke-width="2" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="100" r="120" fill="#6366f1" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="260" r="140" fill="#38bdf8" opacity="0.1" filter="url(#glow)" />
  <circle cx="600" cy="180" r="160" fill="#a855f7" opacity="0.08" filter="url(#glow)" />

  <!-- Animated Workflow Nodes (Visual low-code connector dots in background) -->
  <g>
    <circle class="pulse-node" cx="200" cy="140" r="7" fill="#38bdf8" filter="url(#subtleGlow)" />
    <circle class="pulse-node-2" cx="550" cy="180" r="7" fill="#818cf8" filter="url(#subtleGlow)" />
    <circle class="pulse-node-3" cx="750" cy="200" r="7" fill="#c084fc" filter="url(#subtleGlow)" />
    <circle class="pulse-node" cx="1000" cy="130" r="7" fill="#34d399" filter="url(#subtleGlow)" />
  </g>

  <!-- Foreground Content: Clean, Unobstructed, Highly Readable -->
  <g text-anchor="middle">
    <!-- Top Category Eyebrow / Tag -->
    <g transform="translate(600, 75)">
      <rect x="-165" y="-18" width="330" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="-135" cy="-1" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="-120" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="2" text-anchor="start">THE CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5" filter="url(#subtleGlow)">
      Awesome Low-Code Workflow Automation
    </text>

    <!-- Subtitle -->
    <text x="600" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500" fill="url(#subGrad)">
      Visual Workflow Builders • Business Process Automation • AI Agent Orchestration • iPaaS
    </text>

    <!-- Feature Pillars / Category Badges in Foreground -->
    <g transform="translate(600, 260)">
      <!-- Badge 1: Low-Code / No-Code -->
      <g transform="translate(-370, 0)" class="pill-badge">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.2" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c7d2fe">⚡ Visual Builders</text>
      </g>

      <!-- Badge 2: Open-Source Engines -->
      <g transform="translate(-185, 0)" class="pill-badge">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#0f2b3c" stroke="#0284c7" stroke-width="1.2" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#bae6fd">🌐 Open-Source First</text>
      </g>

      <!-- Badge 3: AI Agents -->
      <g transform="translate(0, 0)" class="pill-badge">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#2e1065" stroke="#7e22ce" stroke-width="1.2" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e9d5ff">🤖 AI Agent Flows</text>
      </g>

      <!-- Badge 4: Enterprise iPaaS -->
      <g transform="translate(185, 0)" class="pill-badge">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#064e3b" stroke="#059669" stroke-width="1.2" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#a7f3d0">🏢 Enterprise iPaaS</text>
      </g>

      <!-- Badge 5: Self-Hosted & Sovereign -->
      <g transform="translate(370, 0)" class="pill-badge">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#3f1d28" stroke="#be123c" stroke-width="1.2" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fecdd3">🔒 Data Sovereign</text>
      </g>
    </g>
  </g>

  <!-- Border Accent Outline -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="16" fill="none" stroke="#334155" stroke-width="1" opacity="0.6" />
</svg>
